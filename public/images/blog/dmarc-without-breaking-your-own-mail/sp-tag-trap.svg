<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs><pattern id="air" width="68" height="68" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="68" height="68" fill="#fff"/><rect width="24" height="68" fill="#c8372d"/><rect x="34" width="24" height="68" fill="#27497a"/></pattern></defs>
<rect x="0" y="0" width="1600" height="900" fill="#dfe8ec"/><rect x="50" y="40" width="1500" height="820" fill="url(#air)" rx="4"/><rect x="68" y="58" width="1464" height="784" fill="#f8fafa"/><text x="110" y="128" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#1d2f4f" font-weight="700" text-anchor="start">One tidy tag cancels the policy for the mail it protects</text><text x="110" y="170" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#5d6d7e" font-weight="400" text-anchor="start">Leave sp= off and subdomains inherit p. All of my mail is sent from a subdomain.</text><text x="110" y="240" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#27497a" font-weight="700" text-anchor="start">As published: no sp= tag</text><rect x="110" y="258" width="660" height="64" fill="#eef3f5" stroke="#c6d3da" stroke-width="2"/><text x="130" y="299" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">v=DMARC1; p=quarantine; ...</text><rect x="110" y="362" width="300" height="128" fill="#fff" stroke="#1d2f4f" stroke-width="2.5"/><text x="130" y="406" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="700" text-anchor="start">root domain</text><text x="130" y="460" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">quarantine</text><line x1="420" y1="426" x2="450.0" y2="426.0" stroke="#1d2f4f" stroke-width="3"/><polygon points="462,426 450.0,419.4 450.0,432.6" fill="#1d2f4f"/><rect x="470" y="362" width="300" height="128" fill="#fff" stroke="#1d2f4f" stroke-width="2.5"/><text x="490" y="406" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="700" text-anchor="start">sending subdomain</text><text x="490" y="460" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">quarantine</text><text x="110" y="548" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">The subdomain inherits p.</text>
<text x="110" y="586" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">The policy covers the mail.</text><text x="830" y="240" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#c8372d" font-weight="700" text-anchor="start">Add sp=none to be tidy</text><rect x="830" y="258" width="660" height="64" fill="#eef3f5" stroke="#c6d3da" stroke-width="2"/><text x="850" y="299" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">v=DMARC1; p=quarantine; sp=none; ...</text><rect x="830" y="362" width="300" height="128" fill="#fff" stroke="#1d2f4f" stroke-width="2.5"/><text x="850" y="406" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="700" text-anchor="start">root domain</text><text x="850" y="460" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">quarantine</text><line x1="1140" y1="426" x2="1170.0" y2="426.0" stroke="#1d2f4f" stroke-width="3"/><polygon points="1182,426 1170.0,419.4 1170.0,432.6" fill="#1d2f4f"/><rect x="1190" y="362" width="300" height="128" fill="#fff" stroke="#1d2f4f" stroke-width="2.5"/><text x="1210" y="406" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="700" text-anchor="start">sending subdomain</text><text x="1210" y="460" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#c8372d" font-weight="700" text-anchor="start">none</text><text x="830" y="548" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c8372d" font-weight="700" text-anchor="start">The policy stops applying to</text>
<text x="830" y="586" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c8372d" font-weight="700" text-anchor="start">the very mail it was there for.</text><rect x="110" y="660" width="1380" height="120" fill="#fbeeec" stroke="#c8372d" stroke-width="2.5"/><text x="800" y="712" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#c8372d" font-weight="700" text-anchor="middle">The record still looks like it says quarantine.</text><text x="800" y="754" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="middle">That is why the setup notes now warn whoever edits that record next.</text>
</svg>
