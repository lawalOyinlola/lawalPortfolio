<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <text x="40" y="46" font-size="22" font-weight="700" fill="#1a3c5e">One foundation, four tracks</text>
  <text x="40" y="70" font-size="13.5" fill="#555555">Set the environment up once; each track reuses the same machines, offensive and defensive.</text>
  <line x1="40" y1="86" x2="920" y2="86" stroke="#c99a2e" stroke-width="2"/>

  <!-- Foundation hub -->
  <rect x="360" y="118" width="240" height="74" rx="8" fill="#1a3c5e"/>
  <text x="480" y="148" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Foundation</text>
  <text x="480" y="170" font-size="12" fill="#c7d3e2" text-anchor="middle">UTM · network · Kali · server</text>
  <text x="480" y="184" font-size="11" fill="#9fb0c6" text-anchor="middle">you are here</text>

  <!-- connectors from hub to spokes -->
  <path d="M480 192 C 480 240, 140 250, 140 300" fill="none" stroke="#c8d3e0" stroke-width="2"/>
  <path d="M480 192 C 480 250, 367 250, 367 300" fill="none" stroke="#c8d3e0" stroke-width="2"/>
  <path d="M480 192 C 480 250, 593 250, 593 300" fill="none" stroke="#c8d3e0" stroke-width="2"/>
  <path d="M480 192 C 480 240, 820 250, 820 300" fill="none" stroke="#c8d3e0" stroke-width="2"/>

  <!-- Pentest (offensive) -->
  <rect x="40" y="300" width="200" height="104" rx="7" fill="none" stroke="#b23b3b" stroke-width="1.5"/>
  <rect x="56" y="316" width="92" height="20" rx="10" fill="#b23b3b"/>
  <text x="102" y="330" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">OFFENSIVE</text>
  <text x="56" y="362" font-size="15" font-weight="700" fill="#1a3c5e">Pentest</text>
  <text x="56" y="382" font-size="11.5" fill="#555555">Recon to root on a box.</text>
  <text x="56" y="397" font-size="10.5" font-weight="700" fill="#2e7d46">Available now</text>

  <!-- Detection (defensive) -->
  <rect x="267" y="300" width="200" height="104" rx="7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="283" y="316" width="92" height="20" rx="10" fill="#2563eb"/>
  <text x="329" y="330" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">DEFENSIVE</text>
  <text x="283" y="362" font-size="15" font-weight="700" fill="#1a3c5e">Detection &amp; SIEM</text>
  <text x="283" y="382" font-size="11.5" fill="#555555">Wazuh, Suricata, FIM.</text>
  <text x="283" y="397" font-size="10.5" font-weight="700" fill="#8a6d1a">Coming next</text>

  <!-- Phishing (purple) -->
  <rect x="493" y="300" width="200" height="104" rx="7" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="509" y="316" width="76" height="20" rx="10" fill="#7c3aed"/>
  <text x="547" y="330" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">PURPLE</text>
  <text x="509" y="362" font-size="15" font-weight="700" fill="#1a3c5e">Phishing bridge</text>
  <text x="509" y="382" font-size="11.5" fill="#555555">Run it, then detect it.</text>
  <text x="509" y="397" font-size="10.5" font-weight="700" fill="#8a6d1a">Planned</text>

  <!-- AI SOC (defensive) -->
  <rect x="720" y="300" width="200" height="104" rx="7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="736" y="316" width="92" height="20" rx="10" fill="#2563eb"/>
  <text x="782" y="330" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">DEFENSIVE</text>
  <text x="736" y="362" font-size="15" font-weight="700" fill="#1a3c5e">AI-augmented SOC</text>
  <text x="736" y="382" font-size="11.5" fill="#555555">Detection, run with AI.</text>
  <text x="736" y="397" font-size="10.5" font-weight="700" fill="#8a6d1a">Planned</text>

  <text x="480" y="440" font-size="12" fill="#777777" text-anchor="middle">The pentest track uses Kali and the targets; the blue-team tracks add the Ubuntu Server box. Build what a track needs, when you need it.</text>
</svg>
