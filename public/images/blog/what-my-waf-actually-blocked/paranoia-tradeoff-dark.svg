<text x="64" y="138" font-size="11" font-weight="700" fill="#f2c230" text-anchor="start" letter-spacing="1.2">OPERATING POINT</text>
<text x="440" y="138" font-size="11" font-weight="700" fill="#f2c230" text-anchor="middle" letter-spacing="1.2">BLOCKED</text>
<text x="602" y="138" font-size="11" font-weight="700" fill="#f2c230" text-anchor="middle" letter-spacing="1.2">FALSE POS.</text>
