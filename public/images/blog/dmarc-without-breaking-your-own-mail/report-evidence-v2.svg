<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs><pattern id="air" width="68" height="68" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="68" height="68" fill="#fff"/><rect width="24" height="68" fill="#c8372d"/><rect x="34" width="24" height="68" fill="#27497a"/></pattern></defs>
<rect x="0" y="0" width="1600" height="900" fill="#dfe8ec"/><rect x="50" y="40" width="1500" height="820" fill="url(#air)" rx="4"/><rect x="68" y="58" width="1464" height="784" fill="#f8fafa"/><text x="110" y="124" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#1d2f4f" font-weight="700" text-anchor="start">What 59 days of reports did and did not prove</text><text x="110" y="188" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">What they show</text><text x="110" y="262" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="74" fill="#1d2f4f" font-weight="700" text-anchor="start">3,718</text><text x="350" y="228" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1d2f4f" font-weight="400" text-anchor="start">messages in 60 unique reports,</text><text x="350" y="260" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1d2f4f" font-weight="400" text-anchor="start">11 September to 8 November</text><rect x="110" y="288" width="730" height="34" fill="#27497a"/><rect x="110" y="288" width="5.9" height="34" fill="#c8372d"/><text x="110" y="354" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c8372d" font-weight="700" text-anchor="start">30 under p=none</text><text x="840" y="354" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#27497a" font-weight="700" text-anchor="end">3,688 under p=quarantine</text><text x="110" y="436" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="64" fill="#1d2f4f" font-weight="700" text-anchor="start">0</text><text x="162" y="406" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">dispositions</text><text x="162" y="434" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">other than none</text><text x="360" y="436" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="64" fill="#1d2f4f" font-weight="700" text-anchor="start">0</text><text x="412" y="406" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">DKIM</text><text x="412" y="434" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">failures</text><text x="610" y="436" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="64" fill="#1d2f4f" font-weight="700" text-anchor="start">0</text><text x="662" y="406" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">SPF</text><text x="662" y="434" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="start">failures</text><text x="110" y="490" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#5d6d7e" font-weight="400" text-anchor="start">20 to 116 messages a day, no days missing,</text><text x="110" y="518" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#5d6d7e" font-weight="400" text-anchor="start">all from the sending subdomain.</text><line x1="880" y1="170" x2="880" y2="516" stroke="#c6d3da" stroke-width="2"/><text x="920" y="188" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c8372d" font-weight="700" text-anchor="start">What they do not</text><text x="920" y="234" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1d2f4f" font-weight="700" text-anchor="start">All 60 reports came from Google.</text><text x="920" y="280" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">Gmail addresses</text><text x="1490" y="280" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#27497a" font-weight="700" text-anchor="end">measured</text><line x1="920" y1="292" x2="1490" y2="292" stroke="#c6d3da" stroke-width="1.5"/><text x="920" y="320" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">Outlook</text><text x="1490" y="320" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#c8372d" font-weight="700" text-anchor="end">not measured</text><line x1="920" y1="332" x2="1490" y2="332" stroke="#c6d3da" stroke-width="1.5"/><text x="920" y="360" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">Yahoo</text><text x="1490" y="360" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#c8372d" font-weight="700" text-anchor="end">not measured</text><line x1="920" y1="372" x2="1490" y2="372" stroke="#c6d3da" stroke-width="1.5"/><text x="920" y="400" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">Company mailboxes</text><text x="1490" y="400" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#c8372d" font-weight="700" text-anchor="end">not measured</text><line x1="920" y1="412" x2="1490" y2="412" stroke="#c6d3da" stroke-width="1.5"/><text x="920" y="468" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1d2f4f" font-weight="400" text-anchor="start">Mail the app sends rarely, such as a monthly report,</text><text x="920" y="498" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1d2f4f" font-weight="400" text-anchor="start">may not have appeared in 59 days at all.</text><line x1="110" y1="546" x2="1490" y2="546" stroke="#1d2f4f" stroke-width="2.5"/><text x="110" y="590" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1d2f4f" font-weight="700" text-anchor="start">How the policy moved</text><rect x="110" y="616" width="420" height="106" fill="#fff" stroke="#5d6d7e" stroke-width="3"/><text x="320.0" y="662" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#5d6d7e" font-weight="700" text-anchor="middle">p=none</text><text x="320.0" y="700" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="middle">where it started</text><rect x="590" y="616" width="420" height="106" fill="#fff" stroke="#27497a" stroke-width="3"/><text x="800.0" y="662" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#27497a" font-weight="700" text-anchor="middle">p=quarantine</text><text x="800.0" y="700" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#1d2f4f" font-weight="400" text-anchor="middle">from 12 September</text><rect x="1070" y="616" width="420" height="106" fill="#c8372d"/><text x="1280.0" y="662" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#fff" font-weight="700" text-anchor="middle">p=reject</text><text x="1280.0" y="700" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">since 10 November</text><line x1="534" y1="669" x2="574" y2="669" stroke="#1d2f4f" stroke-width="3"/><polygon points="586,669 574,662.4 574,675.6" fill="#1d2f4f"/><line x1="1014" y1="669" x2="1054" y2="669" stroke="#1d2f4f" stroke-width="3"/><polygon points="1066,669 1054,662.4 1054,675.6" fill="#1d2f4f"/><text x="110" y="772" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5d6d7e" font-weight="400" text-anchor="start">Rolling back to quarantine is a one-line DNS edit, and the record's TTL is 60 seconds.</text><text x="110" y="808" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5d6d7e" font-weight="400" text-anchor="start">Mail that receivers have already refused cannot be recovered, so the reports get read daily.</text>
</svg>
