<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs><pattern id="air" width="68" height="68" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="68" height="68" fill="#fff"/><rect width="24" height="68" fill="#c8372d"/><rect x="34" width="24" height="68" fill="#27497a"/></pattern></defs>
<rect x="0" y="0" width="1600" height="900" fill="#dfe8ec"/><rect x="50" y="40" width="1500" height="820" fill="url(#air)" rx="4"/><rect x="68" y="58" width="1464" height="784" fill="#f8fafa"/><text x="110" y="128" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#1d2f4f" font-weight="700" text-anchor="start">One lookup over, and nothing visibly broke</text><text x="110" y="170" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#5d6d7e" font-weight="400" text-anchor="start">SPF allows at most ten DNS lookups. Each stamp below is one lookup.</text><text x="110" y="232" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#c8372d" font-weight="700" text-anchor="start">Before: 11 lookups</text><rect x="100" y="246" width="1104" height="142" fill="none" stroke="#1d2f4f" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="112" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="160.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="220" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="268.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="328" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="376.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="436" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="484.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="544" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="592.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">5</text><rect x="652" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="700.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">6</text><rect x="760" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="808.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">7</text><rect x="868" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="916.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">8</text><rect x="976" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="1024.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">9</text><rect x="1084" y="258" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="1132.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">10</text><rect x="1226" y="258" width="96" height="118" fill="#c8372d" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="1274.0" y="332.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">11</text><text x="1340" y="306" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#c8372d" font-weight="700" text-anchor="start">over the</text>
<text x="1340" y="336" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#c8372d" font-weight="700" text-anchor="start">limit</text><text x="110" y="448" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#27497a" font-weight="700" text-anchor="start">After flattening: 5 of 10</text><rect x="100" y="462" width="1104" height="142" fill="none" stroke="#1d2f4f" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="112" y="474" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="160.0" y="548.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="220" y="474" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="268.0" y="548.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="328" y="474" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="376.0" y="548.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="436" y="474" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="484.0" y="548.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="544" y="474" width="96" height="118" fill="#27497a" stroke="#f8fafa" stroke-width="5" stroke-dasharray="5 5"/><text x="592.0" y="548.0" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="42" fill="#fff" font-weight="700" text-anchor="middle">5</text><rect x="652" y="474" width="96" height="118" fill="none" stroke="#c6d3da" stroke-width="3" stroke-dasharray="5 5"/><rect x="760" y="474" width="96" height="118" fill="none" stroke="#c6d3da" stroke-width="3" stroke-dasharray="5 5"/><rect x="868" y="474" width="96" height="118" fill="none" stroke="#c6d3da" stroke-width="3" stroke-dasharray="5 5"/><rect x="976" y="474" width="96" height="118" fill="none" stroke="#c6d3da" stroke-width="3" stroke-dasharray="5 5"/><rect x="1084" y="474" width="96" height="118" fill="none" stroke="#c6d3da" stroke-width="3" stroke-dasharray="5 5"/><text x="1226" y="512" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">root domain and</text>
<text x="1226" y="542" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">sending subdomain</text>
<text x="1226" y="572" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">alike</text><line x1="110" y1="640" x2="1490" y2="640" stroke="#c6d3da" stroke-width="2"/><text x="110" y="684" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1d2f4f" font-weight="700" text-anchor="start">Why one over matters</text><text x="110" y="722" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">Over ten, a receiver may stop evaluating and return a</text>
<text x="110" y="754" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">permanent error, which counts as an SPF failure.</text><text x="830" y="684" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1d2f4f" font-weight="700" text-anchor="start">What flattening costs</text><text x="830" y="722" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">The addresses are now mine to look after. They drift if</text>
<text x="830" y="754" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1d2f4f" font-weight="400" text-anchor="start">the provider changes theirs, so they go on a recheck list.</text>
</svg>
