<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#22302b"/><circle cx="28" cy="28" r="9" fill="#6c7f76"/><line x1="22" y1="26" x2="34" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="28" r="9" fill="#6c7f76"/><line x1="1566" y1="26" x2="1578" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="28" cy="872" r="9" fill="#6c7f76"/><line x1="22" y1="870" x2="34" y2="874" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="872" r="9" fill="#6c7f76"/><line x1="1566" y1="870" x2="1578" y2="874" stroke="#22302b" stroke-width="2.5"/><text x="70" y="96" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#dfe7dd" font-weight="700" text-anchor="start">The gate checks one commit. The server runs another.</text><text x="70" y="138" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#9db3a8" font-weight="400" text-anchor="start">On a quiet day those are the same commit. On a busy afternoon they are not.</text><text x="70" y="228" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#bcd1c3" font-weight="700" text-anchor="start">main</text><line x1="300" y1="220" x2="1530" y2="220" stroke="#3b4f48" stroke-width="2"/><text x="70" y="338" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#bcd1c3" font-weight="700" text-anchor="start">Gate</text><line x1="300" y1="330" x2="1530" y2="330" stroke="#3b4f48" stroke-width="2"/><text x="70" y="448" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#bcd1c3" font-weight="700" text-anchor="start">Commit B's scan</text><line x1="300" y1="440" x2="1530" y2="440" stroke="#3b4f48" stroke-width="2"/><text x="70" y="558" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#bcd1c3" font-weight="700" text-anchor="start">Server</text><line x1="300" y1="550" x2="1530" y2="550" stroke="#3b4f48" stroke-width="2"/><circle cx="380" cy="220" r="24" fill="#2d3e38" stroke="#dfe7dd" stroke-width="3"/><text x="380" y="230" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="26" fill="#dfe7dd" font-weight="700" text-anchor="middle">A</text><circle cx="720" cy="220" r="24" fill="#2d3e38" stroke="#ff7a4d" stroke-width="3"/><text x="720" y="230" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="26" fill="#ff7a4d" font-weight="700" text-anchor="middle">B</text><text x="416" y="196" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9db3a8" font-weight="400" text-anchor="start">PR merges</text><text x="756" y="196" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9db3a8" font-weight="400" text-anchor="start">second PR merges</text><rect x="380" y="310" width="660" height="40" fill="#3a5a4c" stroke="#6fe39a" stroke-width="2"/><text x="398" y="338" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">waits for the checks on commit A's SHA</text><circle cx="1068" cy="330" r="16" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="1068" cy="330" r="11" fill="#6fe39a"/><text x="1094" y="338" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6fe39a" font-weight="700" text-anchor="start">A passes, gate opens</text><rect x="720" y="420" width="780" height="40" fill="#4a2f26" stroke="#ff7a4d" stroke-width="2" stroke-dasharray="10 7"/><text x="738" y="448" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ff7a4d" font-weight="700" text-anchor="start">scan not finished</text><line x1="1068" y1="346" x2="1068" y2="524" stroke="#6c7f76" stroke-width="2.5" stroke-dasharray="6 6"/><rect x="870" y="526" width="490" height="48" fill="#ff7a4d"/><text x="1115" y="558" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#10171a" font-weight="700" text-anchor="middle">git reset --hard origin/main</text><text x="1376" y="558" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#ff7a4d" font-weight="700" text-anchor="start">runs B</text><rect x="70" y="612" width="1460" height="228" fill="#2d3e38" stroke="#3b4f48" stroke-width="2"/><circle cx="112" cy="658" r="16" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="112" cy="658" r="11" fill="#6fe39a"/><text x="142" y="668" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#6fe39a" font-weight="700" text-anchor="start">The repair is small</text><text x="110" y="718" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">The workflow passes the verified SHA to the server, and both the SSH step and the deploy script reset to it.</text><rect x="110" y="738" width="520" height="48" fill="#10171a"/><text x="130" y="770" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#6fe39a" font-weight="400" text-anchor="start">git reset --hard &lt;verified SHA&gt;</text><text x="650" y="770" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">The first deploy after the change printed the commit</text><text x="650" y="804" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">it checked out, and it matched the one the gate had checked.</text>
</svg>
