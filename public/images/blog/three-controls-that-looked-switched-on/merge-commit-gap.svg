<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#22302b"/><circle cx="28" cy="28" r="9" fill="#6c7f76"/><line x1="22" y1="26" x2="34" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="28" r="9" fill="#6c7f76"/><line x1="1566" y1="26" x2="1578" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="28" cy="872" r="9" fill="#6c7f76"/><line x1="22" y1="870" x2="34" y2="874" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="872" r="9" fill="#6c7f76"/><line x1="1566" y1="870" x2="1578" y2="874" stroke="#22302b" stroke-width="2.5"/><text x="70" y="96" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#dfe7dd" font-weight="700" text-anchor="start">A scan of full history that never read a merge commit</text><text x="70" y="138" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#9db3a8" font-weight="400" text-anchor="start">Gitleaks scans the patch text from <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">git log -p</tspan>. For a merge, that prints the header and no diff.</text><line x1="140" y1="300" x2="1120" y2="300" stroke="#bcd1c3" stroke-width="4"/><path d="M320 300 C380 300 400 212 470 212 L640 212 C720 212 780 300 860 300" stroke="#bcd1c3" stroke-width="4" fill="none"/><circle cx="140" cy="300" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="140" cy="300" r="13" fill="#6fe39a"/><circle cx="320" cy="300" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="320" cy="300" r="13" fill="#6fe39a"/><circle cx="500" cy="300" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="500" cy="300" r="13" fill="#6fe39a"/><circle cx="1040" cy="300" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="1040" cy="300" r="13" fill="#6fe39a"/><circle cx="500" cy="212" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="500" cy="212" r="13" fill="#6fe39a"/><circle cx="640" cy="212" r="18" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="640" cy="212" r="13" fill="#6fe39a"/><circle cx="860" cy="300" r="30" fill="#22302b" stroke="#ff7a4d" stroke-width="4"/><circle cx="860" cy="300" r="15" fill="#ff7a4d"/><text x="860" y="366" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#ff7a4d" font-weight="700" text-anchor="middle">merge commit</text><text x="140" y="366" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#6fe39a" font-weight="700" text-anchor="start">ordinary commits: patch scanned</text><text x="1150" y="208" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">If someone resolves a conflict, the</text>
<text x="1150" y="242" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">resolution lives only in the merge.</text>
<text x="1150" y="276" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">A key pasted in while untangling</text>
<text x="1150" y="310" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">it appears in no ordinary commit.</text><rect x="70" y="408" width="800" height="56" fill="#10171a"/><text x="90" y="445" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">git log -p --merges -1</text><text x="900" y="445" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ff7a4d" font-weight="700" text-anchor="start">a commit message and nothing under it</text><rect x="70" y="478" width="800" height="56" fill="#10171a"/><text x="90" y="515" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">git log -p --merges -1 --diff-merges=separate</text><text x="900" y="515" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#6fe39a" font-weight="700" text-anchor="start">the changes</text><rect x="70" y="566" width="1460" height="274" fill="#2d3e38" stroke="#3b4f48" stroke-width="2"/><text x="110" y="614" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#bcd1c3" font-weight="700" text-anchor="start">What the switch found</text><text x="110" y="712" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="92" fill="#dfe7dd" font-weight="700" text-anchor="start">13</text><text x="240" y="670" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">new findings in my own repo. Every one was</text>
<text x="240" y="702" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">already triaged, either rotated or a false</text>
<text x="240" y="734" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">positive, seen again through a merge commit.</text><text x="800" y="712" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="92" fill="#dfe7dd" font-weight="700" text-anchor="start">1,411</text><text x="1120" y="670" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">copies on a fork of OWASP Juice</text>
<text x="1120" y="702" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">Shop: too many fingerprints</text>
<text x="1120" y="734" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#dfe7dd" font-weight="400" text-anchor="start">to be worth keeping.</text><text x="110" y="806" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9db3a8" font-weight="400" text-anchor="start">A new commit means a new fingerprint, so the old suppressions did not match. Same secrets, confirmed by hash.</text>
</svg>
