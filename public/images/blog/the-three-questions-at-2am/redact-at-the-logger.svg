<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="i" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#1f2a5a" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f3eee4"/>
  <text x="80" y="120" font-size="30" font-weight="700" fill="#1f2a5a">redact once, at the logger</text>
  <g fill="none" stroke-width="4">
    <rect x="80" y="210" width="520" height="320" rx="14" stroke="#d9472f"/>
    <rect x="680" y="290" width="260" height="160" rx="14" stroke="#1f2a5a"/>
    <rect x="1020" y="210" width="500" height="320" rx="14" stroke="#1f2a5a"/>
  </g>
  <g stroke="#1f2a5a" stroke-width="4">
    <line x1="600" y1="370" x2="672" y2="370" marker-end="url(#i)"/>
    <line x1="940" y1="370" x2="1012" y2="370" marker-end="url(#i)"/>
  </g>
  <g font-size="24" fill="#6b6f86">
    <text x="110" y="260">the debug line prints the request</text>
    <text x="1050" y="260">what reaches the log file</text>
  </g>
  <g font-family="Menlo, Courier New, monospace" font-size="22">
    <g fill="#d9472f">
      <text x="110" y="330">authorization: Bearer eyJhbGciOi…</text>
      <text x="110" y="390">cookie: session=8f3c2a…</text>
      <text x="110" y="450">password: correct-horse</text>
    </g>
    <g fill="#1f2a5a">
      <text x="1050" y="330">authorization: [redacted]</text>
      <text x="1050" y="390">cookie: [redacted]</text>
      <text x="1050" y="450">password: [redacted]</text>
    </g>
  </g>
  <text x="810" y="365" font-size="30" font-weight="700" fill="#1f2a5a" text-anchor="middle">logger</text>
  <text x="810" y="405" font-size="20" fill="#6b6f86" text-anchor="middle">strips these fields</text>
  <text x="810" y="430" font-size="20" fill="#6b6f86" text-anchor="middle">wherever they appear</text>
  <g font-size="26" fill="#6b6f86">
    <text x="80" y="640">One rule in the logger covers every call site, including the debug line added in a hurry.</text>
    <text x="80" y="686">The error reporter captures the same request, so it needs the same rule.</text>
  </g>
</svg>
