<text x="621" y="209" font-size="32" font-weight="700" fill="#ef6a4c" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">2</text>
<line x1="603" y1="198" x2="639" y2="198" stroke="#0d1120" stroke-width="2"/>
<text x="690" y="195" font-size="13" font-weight="400" fill="#9aa1b8" text-anchor="start" >Legit PATCH blocked</text>
<text x="690" y="212" font-size="13" font-weight="400" fill="#9aa1b8" text-anchor="start" >by the method rule</text>
<text x="64" y="279" font-size="18" font-weight="700" fill="#f2f1ec" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">PL1 TUNED</text>
<text x="64" y="299" font-size="11.5" font-weight="400" fill="#9aa1b8" text-anchor="start" >One method exclusion</text>
<rect x="400" y="252" width="36" height="52" rx="4" fill="#1e2438"/>
<text x="418" y="289" font-size="32" font-weight="700" fill="#f2f1ec" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">1</text>
<line x1="400" y1="278" x2="436" y2="278" stroke="#0d1120" stroke-width="2"/>
<rect x="441" y="252" width="36" height="52" rx="4" fill="#1e2438"/>
