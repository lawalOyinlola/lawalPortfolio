<svg class="dg" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <text class="dg-t-ink" x="40" y="44" font-size="22" font-weight="700" fill="#1a3c5e">The rig</text>
  <text class="dg-t-body" x="40" y="68" font-size="13.5" fill="#555555">Two identical proxies in front of one target. Only the rule engine differs.</text>
  <line x1="40" y1="84" x2="940" y2="84" stroke="#c99a2e" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path class="dg-m-ink" d="M0,0 L8,3 L0,6 Z" fill="#1a3c5e"/>
    </marker>
  </defs>

  <!-- the suite -->
  <rect class="dg-f-mist dg-s-ink" x="40" y="168" width="190" height="130" rx="6" fill="#f7f9fb" stroke="#1a3c5e" stroke-width="2"/>
  <text class="dg-t-ink" x="135" y="204" font-size="15" font-weight="700" fill="#1a3c5e" text-anchor="middle">Payload suite</text>
  <text class="dg-t-muted" x="135" y="230" font-size="11" fill="#777777" text-anchor="middle">attack/suite.py</text>
  <text class="dg-t-muted" x="135" y="250" font-size="11" fill="#777777" text-anchor="middle">20 attacks, 9 normal</text>
  <text class="dg-t-muted" x="135" y="270" font-size="11" fill="#777777" text-anchor="middle">each sent to both ports</text>

  <g class="dg-s-ink" stroke="#1a3c5e" stroke-width="1.6" fill="none">
    <path d="M230 210 L298 160" marker-end="url(#arrow)"/>
    <path d="M230 256 L298 306" marker-end="url(#arrow)"/>
  </g>

  <!-- the control listener -->
  <rect class="dg-f-mist dg-s-ink" x="300" y="116" width="230" height="110" rx="6" fill="#f7f9fb" stroke="#1a3c5e" stroke-width="2"/>
  <text class="dg-t-ink" x="415" y="148" font-size="15" font-weight="700" fill="#1a3c5e" text-anchor="middle">control</text>
  <text class="dg-t-muted" x="415" y="170" font-size="12" fill="#777777" text-anchor="middle">localhost:9080</text>
  <text class="dg-t-muted" x="415" y="192" font-size="12" fill="#777777" text-anchor="middle">same image, same config</text>
  <rect x="345" y="202" width="140" height="18" rx="9" fill="#5a4a2a"/>
  <text x="415" y="215" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">engine: Off</text>

  <!-- the WAF listener -->
  <rect x="300" y="240" width="230" height="110" rx="6" fill="#1a3c5e"/>
  <text x="415" y="272" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">waf</text>
  <text x="415" y="294" font-size="12" fill="#d7e0ec" text-anchor="middle">localhost:8080</text>
  <text x="415" y="316" font-size="12" fill="#d7e0ec" text-anchor="middle">NGINX + ModSecurity + OWASP CRS</text>
  <rect x="330" y="326" width="170" height="18" rx="9" fill="#c99a2e"/>
  <text x="415" y="339" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">engine: the phase's setting</text>

  <g class="dg-s-ink" stroke="#1a3c5e" stroke-width="1.6" fill="none">
    <path d="M530 171 L598 215" marker-end="url(#arrow)"/>
    <path d="M530 295 L598 251" marker-end="url(#arrow)"/>
  </g>

  <!-- the target -->
  <rect class="dg-f-mist dg-s-ink" x="600" y="168" width="340" height="130" rx="6" fill="#f7f9fb" stroke="#1a3c5e" stroke-width="2"/>
  <text class="dg-t-ink" x="770" y="204" font-size="15" font-weight="700" fill="#1a3c5e" text-anchor="middle">Juice Shop v20.3.0</text>
  <text class="dg-t-muted" x="770" y="230" font-size="11" fill="#777777" text-anchor="middle">deliberately vulnerable web app</text>
  <text class="dg-t-muted" x="770" y="250" font-size="11" fill="#777777" text-anchor="middle">on a private network, no published port</text>
  <text class="dg-t-muted" x="770" y="270" font-size="11" fill="#777777" text-anchor="middle">reachable only through the two proxies</text>

  <!-- audit log and summary -->
  <rect class="dg-f-mist dg-s-ink" x="300" y="410" width="230" height="70" rx="6" fill="#f7f9fb" stroke="#1a3c5e" stroke-width="2"/>
  <text class="dg-t-ink" x="415" y="438" font-size="14" font-weight="700" fill="#1a3c5e" text-anchor="middle">Audit log</text>
  <text class="dg-t-muted" x="415" y="458" font-size="11" fill="#777777" text-anchor="middle">JSON, one entry per flagged request</text>

  <rect class="dg-f-mist dg-s-ink" x="600" y="410" width="340" height="70" rx="6" fill="#f7f9fb" stroke="#1a3c5e" stroke-width="2"/>
  <text class="dg-t-ink" x="770" y="438" font-size="14" font-weight="700" fill="#1a3c5e" text-anchor="middle">summarise.py</text>
  <text class="dg-t-muted" x="770" y="458" font-size="11" fill="#777777" text-anchor="middle">joins the log to the results by X-Case-Id</text>

  <g class="dg-s-ink" stroke="#1a3c5e" stroke-width="1.6" fill="none">
    <path d="M415 350 L415 408" marker-end="url(#arrow)"/>
    <path d="M530 445 L598 445" marker-end="url(#arrow)"/>
  </g>
  <text class="dg-t-muted" x="428" y="384" font-size="10.5" fill="#777777" font-style="italic">rule hits and scores</text>

  <!-- why two -->
  <rect class="dg-f-callout" x="40" y="380" width="220" height="100" rx="6" fill="#f5f2e8"/>
  <text class="dg-t-gold" x="54" y="404" font-size="12" font-weight="700" fill="#8a6d1a">Why two proxies</text>
  <text class="dg-t-gold" x="54" y="424" font-size="10.5" fill="#8a6d1a">Both add the same hop, so a</text>
  <text class="dg-t-gold" x="54" y="440" font-size="10.5" fill="#8a6d1a">difference between the ports is</text>
  <text class="dg-t-gold" x="54" y="456" font-size="10.5" fill="#8a6d1a">the WAF, not the proxy.</text>
</svg>
