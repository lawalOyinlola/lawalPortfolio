<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#22302b"/><circle cx="28" cy="28" r="9" fill="#6c7f76"/><line x1="22" y1="26" x2="34" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="28" r="9" fill="#6c7f76"/><line x1="1566" y1="26" x2="1578" y2="30" stroke="#22302b" stroke-width="2.5"/><circle cx="28" cy="872" r="9" fill="#6c7f76"/><line x1="22" y1="870" x2="34" y2="874" stroke="#22302b" stroke-width="2.5"/><circle cx="1572" cy="872" r="9" fill="#6c7f76"/><line x1="1566" y1="870" x2="1578" y2="874" stroke="#22302b" stroke-width="2.5"/><text x="70" y="96" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#dfe7dd" font-weight="700" text-anchor="start">The rate limiter that saw one visitor</text><text x="70" y="138" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#9db3a8" font-weight="400" text-anchor="start">The config in the repo set the header. The live one was older, and nobody had diffed the two.</text><text x="70" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#bcd1c3" font-weight="700" text-anchor="start" letter-spacing="2">NGINX ON THE SERVER</text><text x="470" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#bcd1c3" font-weight="700" text-anchor="start" letter-spacing="2">CLIENT SENDS</text><text x="770" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#bcd1c3" font-weight="700" text-anchor="start" letter-spacing="2">APP READS</text><text x="1040" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#bcd1c3" font-weight="700" text-anchor="start" letter-spacing="2">WHAT THAT MEANS</text><line x1="70" y1="210" x2="1530" y2="210" stroke="#bcd1c3" stroke-width="2"/><circle cx="88" cy="254" r="16" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="88" cy="254" r="11" fill="#ff7a4d"/><text x="120" y="262" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">never set the header</text><text x="470" y="262" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">nothing</text><text x="770" y="262" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#ff7a4d" font-weight="700" text-anchor="start">127.0.0.1</text><text x="1040" y="262" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">Every visitor shares one bucket per</text>
<text x="1040" y="294" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">route. One busy client can use up</text>
<text x="1040" y="326" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">the login limit for everyone.</text><line x1="70" y1="346" x2="1530" y2="346" stroke="#3b4f48" stroke-width="2"/><circle cx="88" cy="380" r="16" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="88" cy="380" r="11" fill="#ff7a4d"/><text x="120" y="388" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">never set the header,</text>
<text x="120" y="420" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">passes on what it gets</text><text x="470" y="388" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">203.0.113.7</text><text x="770" y="388" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#ff7a4d" font-weight="700" text-anchor="start">203.0.113.7</text><text x="1040" y="388" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">A client picks its own address, in</text>
<text x="1040" y="420" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">the rate limiter and the audit log.</text><line x1="70" y1="472" x2="1530" y2="472" stroke="#3b4f48" stroke-width="2"/><circle cx="88" cy="506" r="16" fill="#0d1412" stroke="#6c7f76" stroke-width="2"/><circle cx="88" cy="506" r="11" fill="#6fe39a"/><text x="120" y="514" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">sets it, and the app</text>
<text x="120" y="546" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">trusts exactly one hop</text><text x="470" y="514" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">anything</text><text x="770" y="514" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#6fe39a" font-weight="700" text-anchor="start">NGINX's entry</text><text x="1040" y="514" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">The address NGINX appended,</text>
<text x="1040" y="546" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#dfe7dd" font-weight="400" text-anchor="start">which the client cannot forge.</text><line x1="70" y1="598" x2="1530" y2="598" stroke="#3b4f48" stroke-width="2"/><rect x="70" y="646" width="1460" height="194" fill="#2d3e38" stroke="#3b4f48" stroke-width="2"/><text x="110" y="692" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#6fe39a" font-weight="700" text-anchor="start">The repair was one line in the API's NGINX block</text><rect x="110" y="710" width="1000" height="52" fill="#10171a"/><text x="130" y="745" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#6fe39a" font-weight="400" text-anchor="start">proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</text><text x="110" y="808" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#9db3a8" font-weight="400" text-anchor="start">A coarse per-client limit went in at the edge as well. Of 200 requests fired in a burst at a health endpoint, 17 came back <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">429</tspan>.</text>
</svg>
