<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e7d46"/>
    </marker>
    <marker id="gold" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c99a2e"/>
    </marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b23b3b"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#1a3c5e">The detection pipeline: three layers, one dashboard</text>
  <text x="40" y="68" font-size="13.5" fill="#555555">Agents ship host logs to Wazuh; Suricata adds the network layer; file-integrity events are checked against VirusTotal and auto-cleaned.</text>
  <line x1="40" y1="84" x2="920" y2="84" stroke="#c99a2e" stroke-width="2"/>

  <!-- VirusTotal (threat intel) -->
  <rect x="430" y="110" width="190" height="56" rx="8" fill="#5a4a2a"/>
  <text x="525" y="134" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">VirusTotal</text>
  <text x="525" y="152" font-size="11" fill="#e2d6bb" text-anchor="middle">threat intel (hash lookup)</text>

  <!-- Kali endpoint -->
  <rect x="56" y="196" width="214" height="78" rx="8" fill="#1a3c5e"/>
  <text x="76" y="224" font-size="16" font-weight="700" fill="#ffffff">Kali</text>
  <text x="76" y="246" font-size="11.5" fill="#b9c7da">Wazuh agent · attacker</text>
  <text x="76" y="263" font-size="11.5" fill="#b9c7da">192.168.64.2</text>

  <!-- x86 target endpoint -->
  <rect x="56" y="306" width="214" height="120" rx="8" fill="#1a3c5e"/>
  <text x="76" y="334" font-size="16" font-weight="700" fill="#ffffff">Ubuntu endpoint</text>
  <text x="76" y="356" font-size="11.5" fill="#b9c7da">Wazuh agent</text>
  <text x="76" y="374" font-size="11.5" fill="#b9c7da">Suricata IDS</text>
  <text x="76" y="392" font-size="11.5" fill="#b9c7da">FIM watch (/home /tmp /var/www)</text>
  <text x="76" y="412" font-size="11.5" fill="#9fb0c6">192.168.64.4</text>

  <!-- Wazuh server -->
  <rect x="690" y="206" width="214" height="200" rx="8" fill="#1a3c5e"/>
  <text x="797" y="236" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Wazuh server</text>
  <text x="797" y="254" font-size="11" fill="#9fb0c6" text-anchor="middle">192.168.64.3</text>
  <rect x="712" y="272" width="170" height="30" rx="6" fill="none" stroke="#3b5a7a" stroke-width="1.3"/>
  <text x="797" y="291" font-size="12" fill="#d7e0ec" text-anchor="middle">Manager</text>
  <rect x="712" y="310" width="170" height="30" rx="6" fill="none" stroke="#3b5a7a" stroke-width="1.3"/>
  <text x="797" y="329" font-size="12" fill="#d7e0ec" text-anchor="middle">Indexer</text>
  <rect x="712" y="348" width="170" height="30" rx="6" fill="none" stroke="#3b5a7a" stroke-width="1.3"/>
  <text x="797" y="367" font-size="12" fill="#d7e0ec" text-anchor="middle">Dashboard</text>

  <!-- logs: endpoints -> server -->
  <path d="M270 232 C 480 232, 520 250, 688 262" fill="none" stroke="#2e7d46" stroke-width="2" marker-end="url(#g)"/>
  <text x="430" y="226" font-size="11.5" font-weight="700" fill="#2e7d46" text-anchor="middle">host logs</text>

  <path d="M270 360 C 480 360, 540 320, 688 300" fill="none" stroke="#2e7d46" stroke-width="2" marker-end="url(#g)"/>
  <text x="430" y="372" font-size="11.5" font-weight="700" fill="#2e7d46" text-anchor="middle">host logs · Suricata eve.json · FIM</text>

  <!-- VirusTotal enrichment <-> manager -->
  <path d="M620 140 C 700 140, 760 180, 772 270" fill="none" stroke="#c99a2e" stroke-width="2" marker-end="url(#gold)"/>
  <text x="712" y="150" font-size="11.5" font-weight="700" fill="#8a6d1a">enrich</text>

  <!-- active response: server -> target (delete) -->
  <path d="M700 392 C 470 460, 320 450, 268 410" fill="none" stroke="#b23b3b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <text x="470" y="476" font-size="11.5" font-weight="700" fill="#b23b3b" text-anchor="middle">active response: auto-delete confirmed malware</text>
</svg>
