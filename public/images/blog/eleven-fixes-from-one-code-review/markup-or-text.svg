<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#f0bb22"/><rect x="50" y="40" width="1500" height="820" fill="#fbf8ee"/><text x="100" y="118" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#141414" font-weight="700" text-anchor="start">One vehicle name, two ways to render it</text><text x="100" y="172" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#5f5a4c" font-weight="400" text-anchor="start">A member of one organisation types this as a vehicle name:</text><rect x="100" y="190" width="700" height="62" fill="#fff" stroke="#141414" stroke-width="2.5"/><text x="122" y="231" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="30" fill="#141414" font-weight="700" text-anchor="start">&lt;img src=x onerror=...&gt;</text><text x="100" y="330" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#d7261e" font-weight="700" text-anchor="start">Before</text><rect x="100" y="350" width="560" height="130" fill="#fff" stroke="#d9d3bf" stroke-width="2"/><text x="120" y="424" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#141414" font-weight="400" text-anchor="start">setHTML(`&lt;p&gt;${vehicle.name}&lt;/p&gt;`)</text><path d="M120 438 q12 -10 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" stroke="#d7261e" stroke-width="3" fill="none"/><line x1="676" y1="415" x2="748.0" y2="415.0" stroke="#d7261e" stroke-width="4"/><polygon points="760,415 748.0,408.4 748.0,421.6" fill="#d7261e"/><rect x="772" y="378" width="240" height="74" fill="#d7261e"/><text x="892" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff" font-weight="700" text-anchor="middle">becomes markup</text><line x1="1024" y1="415" x2="1076.0" y2="415.0" stroke="#d7261e" stroke-width="4"/><polygon points="1088,415 1076.0,408.4 1076.0,421.6" fill="#d7261e"/><text x="1100" y="398" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="400" text-anchor="start">It runs in the browser of everyone</text>
<text x="1100" y="432" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="400" text-anchor="start">else who can see that vehicle.</text><text x="1100" y="474" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#d7261e" font-weight="700" text-anchor="start">stored cross-site scripting</text><text x="100" y="620" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1f6fb2" font-weight="700" text-anchor="start">After</text><rect x="100" y="640" width="560" height="130" fill="#fff" stroke="#d9d3bf" stroke-width="2"/><text x="120" y="698" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#141414" font-weight="400" text-anchor="start">name.textContent = vehicle.name;</text><text x="120" y="738" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="25" fill="#141414" font-weight="400" text-anchor="start">setDOMContent(container);</text><line x1="676" y1="705" x2="748.0" y2="705.0" stroke="#1f6fb2" stroke-width="4"/><polygon points="760,705 748.0,698.4 748.0,711.6" fill="#1f6fb2"/><rect x="772" y="668" width="240" height="74" fill="#1f6fb2"/><text x="892" y="716" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff" font-weight="700" text-anchor="middle">stays text</text><line x1="1024" y1="705" x2="1076.0" y2="705.0" stroke="#1f6fb2" stroke-width="4"/><polygon points="1088,705 1076.0,698.4 1076.0,711.6" fill="#1f6fb2"/><text x="1100" y="688" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="400" text-anchor="start">The popup shows the characters</text>
<text x="1100" y="722" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="400" text-anchor="start">and nothing runs.</text><text x="1100" y="764" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1f6fb2" font-weight="700" text-anchor="start">the fix</text><line x1="100" y1="558" x2="1500" y2="558" stroke="#d9d3bf" stroke-width="2"/>
</svg>
