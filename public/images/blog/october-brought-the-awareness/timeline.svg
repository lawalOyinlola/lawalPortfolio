<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#f4efe3"/>
  <!-- faint schematic grid -->
  <g stroke="#e4dccb" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>

  <text x="80" y="88" font-size="40" font-weight="700" fill="#22262b">Eight days on npm before any scanner knew</text>
  <text x="80" y="126" font-size="21" fill="#5a5a52">The three Next.js advisories of October 2026, from the vendor to my repositories. All times UTC.</text>
  <line x1="80" y1="150" x2="1520" y2="150" stroke="#e8692a" stroke-width="3"/>

  <!-- the 8-day bracket: 14 Oct 17:46 (x=204) to 22 Oct 15:50 (x=1101) -->
  <path d="M204 452 V430 H1101 V452" fill="none" stroke="#e8692a" stroke-width="4"/>
  <text x="652" y="392" font-size="44" font-weight="700" fill="#e8692a" text-anchor="middle">8 days</text>
  <text x="652" y="420" font-size="19" fill="#22262b" text-anchor="middle">the fix is on npm, and every scanner reading the GitHub Advisory Database is blind</text>

  <!-- axis: 14 Oct at x=120, 26 Oct at x=1480, 113.33 per day -->
  <line x1="120" y1="560" x2="1480" y2="560" stroke="#22262b" stroke-width="3"/>
  <g stroke="#22262b" stroke-width="2">
    <line x1="120" y1="552" x2="120" y2="568"/><line x1="233.3" y1="552" x2="233.3" y2="568"/>
    <line x1="346.7" y1="552" x2="346.7" y2="568"/><line x1="460" y1="552" x2="460" y2="568"/>
    <line x1="573.3" y1="552" x2="573.3" y2="568"/><line x1="686.7" y1="552" x2="686.7" y2="568"/>
    <line x1="800" y1="552" x2="800" y2="568"/><line x1="913.3" y1="552" x2="913.3" y2="568"/>
    <line x1="1026.7" y1="552" x2="1026.7" y2="568"/><line x1="1140" y1="552" x2="1140" y2="568"/>
    <line x1="1253.3" y1="552" x2="1253.3" y2="568"/><line x1="1366.7" y1="552" x2="1366.7" y2="568"/>
    <line x1="1480" y1="552" x2="1480" y2="568"/>
  </g>
  <g font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="15" fill="#8a8a80" text-anchor="middle">
    <text x="120" y="592">14</text><text x="233.3" y="592">15</text><text x="346.7" y="592">16</text>
    <text x="460" y="592">17</text><text x="573.3" y="592">18</text><text x="686.7" y="592">19</text>
    <text x="800" y="592">20</text><text x="913.3" y="592">21</text><text x="1026.7" y="592">22</text>
    <text x="1140" y="592">23</text><text x="1253.3" y="592">24</text><text x="1366.7" y="592">25</text>
    <text x="1480" y="592">26</text>
    <text x="1530" y="592" text-anchor="start">OCT</text>
  </g>

  <!-- A: vendor publishes, 14 Oct 17:46 -->
  <line x1="204" y1="560" x2="204" y2="300" stroke="#e8692a" stroke-width="2"/>
  <circle cx="204" cy="560" r="9" fill="#e8692a"/>
  <text x="216" y="232" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#e8692a">14 OCT 17:46</text>
  <text x="216" y="260" font-size="20" font-weight="700" fill="#22262b">Next.js publishes the three advisories</text>
  <text x="216" y="286" font-size="18" fill="#5a5a52">16.4.1 ships a minute later, naming all three</text>

  <!-- B: database listing, 22 Oct 15:50 to 16:42 -->
  <line x1="1101" y1="560" x2="1101" y2="300" stroke="#22262b" stroke-width="2"/>
  <circle cx="1101" cy="560" r="9" fill="#22262b"/>
  <text x="1089" y="232" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#22262b" text-anchor="end">22 OCT 15:50 TO 16:42</text>
  <text x="1089" y="260" font-size="20" font-weight="700" fill="#22262b" text-anchor="end">GitHub Advisory Database lists them</text>
  <text x="1089" y="286" font-size="18" fill="#5a5a52" text-anchor="end">pnpm audit, npm audit, Dependabot, OSV can now see them</text>

  <!-- E: first daily audit, 24 Oct 10:23 -->
  <line x1="1302" y1="560" x2="1302" y2="340" stroke="#1f6f73" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="1302" cy="560" r="9" fill="#1f6f73"/>
  <text x="1314" y="300" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#1f6f73">24 OCT 10:23</text>
  <text x="1314" y="326" font-size="18" fill="#22262b">New daily audit fails</text>
  <text x="1314" y="350" font-size="18" fill="#22262b">on 3 newer highs</text>

  <!-- C: last green CI, 22 Oct 14:54 -->
  <line x1="1097" y1="560" x2="1097" y2="650" stroke="#8a8a80" stroke-width="2"/>
  <circle cx="1097" cy="560" r="6" fill="#f4efe3" stroke="#8a8a80" stroke-width="3"/>
  <text x="1085" y="676" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#8a8a80" text-anchor="end">22 OCT 14:54</text>
  <text x="1085" y="702" font-size="18" fill="#22262b" text-anchor="end">Last CI run passes, audit included,</text>
  <text x="1085" y="726" font-size="18" fill="#22262b" text-anchor="end">56 minutes before the listing</text>

  <!-- D: three projects patched, 23 Oct 09:22 to 14:46 -->
  <rect x="1185" y="552" width="26" height="16" fill="#22262b"/>
  <line x1="1198" y1="568" x2="1198" y2="650" stroke="#22262b" stroke-width="2"/>
  <text x="1150" y="676" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#22262b">23 OCT 09:22 TO 14:46</text>
  <text x="1150" y="702" font-size="18" fill="#22262b">Three projects patched,</text>
  <text x="1150" y="726" font-size="18" fill="#22262b">no Dependabot alert before any fix</text>

  <!-- F: 26 Oct, unpatched project -->
  <line x1="1480" y1="606" x2="1480" y2="770" stroke="#e8692a" stroke-width="2"/>
  <text x="1480" y="796" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace" font-size="17" font-weight="700" fill="#e8692a" text-anchor="end">26 OCT</text>
  <text x="1480" y="822" font-size="18" fill="#22262b" text-anchor="end">A fourth project, still vulnerable with alerts on:</text>
  <text x="1480" y="846" font-size="18" fill="#22262b" text-anchor="end">no Dependabot alert, almost four days after the listing</text>
</svg>
