<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect x="0" y="0" width="1600" height="900" fill="#f0bb22"/><rect x="50" y="40" width="1500" height="820" fill="#fbf8ee"/><text x="100" y="112" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#141414" font-weight="700" text-anchor="start">The fixes this post names</text><text x="1500" y="110" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#5f5a4c" font-weight="400" text-anchor="end">from a review pass of eleven commits</text><text x="100" y="166" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#5f5a4c" font-weight="700" text-anchor="start" letter-spacing="2">WHERE</text><text x="430" y="166" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#d7261e" font-weight="700" text-anchor="start" letter-spacing="2">WHAT IT DID</text><text x="960" y="166" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f6fb2" font-weight="700" text-anchor="start" letter-spacing="2">NOW</text><line x1="100" y1="180" x2="1500" y2="180" stroke="#141414" stroke-width="2.5"/><text x="100" y="226" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Map popup</text><text x="430" y="226" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">built HTML from <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">vehicle.name</tspan> with <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">setHTML</tspan></text><text x="960" y="226" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start"><tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">textContent</tspan> and <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">setDOMContent</tspan></text><path d="M1470 218 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="248" x2="1500" y2="248" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="287" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">CSRF check</text><text x="430" y="287" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">compared the tokens with <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">!==</tspan></text><text x="960" y="287" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start"><tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">timingSafeEqual</tspan>, with a length check first</text><path d="M1470 279 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="309" x2="1500" y2="309" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="348" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Google sign-in</text><text x="430" y="348" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">never checked who issued the token</text><text x="960" y="348" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start"><tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">iss</tspan> must be one of Google's two values</text><path d="M1470 340 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="370" x2="1500" y2="370" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="409" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Login field</text><text x="430" y="409" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">no maximum length, for bcrypt to chew on</text><text x="960" y="409" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start"><tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">@MaxLength(128)</tspan>, 64 on the login form</text><path d="M1470 401 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="431" x2="1500" y2="431" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="470" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Admin list endpoints</text><text x="430" y="470" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">returned every row in the table</text><text x="960" y="470" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start"><tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">page</tspan> and <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">limit</tspan>, with a cap per page</text><path d="M1470 462 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="492" x2="1500" y2="492" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="531" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Vehicle colour</text><text x="430" y="531" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">string went straight into CSS <tspan font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">color</tspan></text><text x="960" y="531" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">hex pattern check, ignored if it does not match</text><path d="M1470 523 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="553" x2="1500" y2="553" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="592" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Ownership transfer</text><text x="430" y="592" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">could pick an inactive or suspended admin</text><text x="960" y="592" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">no longer allowed</text><path d="M1470 584 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="614" x2="1500" y2="614" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="653" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Superadmin routes</text><text x="430" y="653" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">one guard, at the API</text><text x="960" y="653" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">second guard at the proxy, for convenience</text><path d="M1470 645 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="675" x2="1500" y2="675" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="714" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#141414" font-weight="700" text-anchor="start">Rate limiter message</text><text x="430" y="714" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">said exactly how long to wait</text><text x="960" y="714" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#141414" font-weight="400" text-anchor="start">trimmed</text><path d="M1470 706 l9 9 l17 -21" stroke="#d7261e" stroke-width="3.6" fill="none" stroke-linecap="round"/><line x1="100" y1="736" x2="1500" y2="736" stroke="#d9d3bf" stroke-width="1.5"/><text x="100" y="806" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#141414" font-weight="700" text-anchor="start">Each is a small decision in the app's own code. No scanner had flagged any of them.</text>
</svg>
