<line x1="603" y1="278" x2="639" y2="278" stroke="#0d1120" stroke-width="2"/>
<text x="690" y="283" font-size="13" font-weight="700" fill="#f2c230" text-anchor="start" >The operating point</text>
<text x="64" y="359" font-size="18" font-weight="700" fill="#f2f1ec" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">PL2</text>
<text x="64" y="379" font-size="11.5" font-weight="400" fill="#9aa1b8" text-anchor="start" >Higher paranoia</text>
<rect x="400" y="332" width="36" height="52" rx="4" fill="#1e2438"/>
<text x="418" y="369" font-size="32" font-weight="700" fill="#f2f1ec" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">1</text>
<line x1="400" y1="358" x2="436" y2="358" stroke="#0d1120" stroke-width="2"/>
<rect x="441" y="332" width="36" height="52" rx="4" fill="#1e2438"/>
<text x="459" y="369" font-size="32" font-weight="700" fill="#f2f1ec" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">2</text>
<line x1="441" y1="358" x2="477" y2="358" stroke="#0d1120" stroke-width="2"/>
<rect x="562" y="332" width="36" height="52" rx="4" fill="#1e2438"/>
<line x1="562" y1="358" x2="598" y2="358" stroke="#0d1120" stroke-width="2"/>
<rect x="603" y="332" width="36" height="52" rx="4" fill="#1e2438"/>
<text x="621" y="369" font-size="32" font-weight="700" fill="#ef6a4c" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Courier New, monospace">2</text>
<line x1="603" y1="358" x2="639" y2="358" stroke="#0d1120" stroke-width="2"/>
<text x="690" y="363" font-size="13" font-weight="400" fill="#9aa1b8" text-anchor="start" >A password, a business name</text>
<text x="40" y="438" font-size="15" font-weight="700" fill="#f2f1ec" text-anchor="start" >Attacks blocked never moved from 12. More paranoia, in this application, was pure cost.</text>
<text x="40" y="466" font-size="12" font-weight="400" fill="#9aa1b8" text-anchor="start" >Untuned PL1 also returned 403 on a thirteenth case, a cross-tenant PATCH, but by the method rule rather than by attack detection.</text>
<text x="40" y="484" font-size="12" font-weight="400" fill="#9aa1b8" text-anchor="start" >It is the same misfire behind the two false positives, so it is not counted as coverage.</text>
</svg>
